name: macOS installation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test scripts/update.test.mjs
      - name: Install and test the checked-out formula
        run: |
          brew tap sefastech/tap "$GITHUB_WORKSPACE"
          brew install --build-from-source sefastech/tap/clutta
          brew test sefastech/tap/clutta
          clutta --help
